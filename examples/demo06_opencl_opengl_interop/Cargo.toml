[package]
name = "demo06_opencl_opengl_interop"
version = "0.1.0"
edition = "2021"
description = "OpenCL+OpenGL zero-copy interop: n-body simulation on GPU, rendered via shared VBO"

[dependencies]
ocl = { workspace = true }
rand = { workspace = true }
glutin = "0.32"
glow = "0.14"
winit = "0.30"
glutin-winit = "0.5"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
